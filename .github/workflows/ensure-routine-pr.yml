name: ensure-routine-pr

on:
  push:
    branches:
      - "claude/**"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-pr:
    name: ensure Routine branches have PRs
    runs-on: ubuntu-latest
    steps:
      - name: Open missing Routine PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const digestTypes = new Map([
              ["legislative-digest.md", "legislative digest"],
              ["newsletter-digest.md", "newsletter digest"],
              ["paper-tracking.md", "paper tracking digest"],
              ["news-updates.md", "news updates"],
            ]);

            function stripQuotes(value) {
              return value.replace(/^["']|["']$/g, "").trim();
            }

            function extractEditorNote(markdown) {
              const match = markdown.match(/^---\n([\s\S]*?)\n---/);
              if (!match) return "";

              const lines = match[1].split(/\r?\n/);
              const noteLine = lines.find((line) => line.startsWith("editor_note:"));
              if (!noteLine) return "";

              return stripQuotes(noteLine.replace(/^editor_note:\s*/, ""));
            }

            async function listRoutineBranches() {
              const branches = [];
              for await (const response of github.paginate.iterator(github.rest.repos.listBranches, {
                owner,
                repo,
                per_page: 100,
              })) {
                branches.push(
                  ...response.data
                    .map((branch) => branch.name)
                    .filter((name) => name.startsWith("claude/")),
                );
              }
              return branches;
            }

            async function prAlreadyExists(branch) {
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: "all",
                head: `${owner}:${branch}`,
              });

              if (prs.length > 0) {
                core.info(`PR already exists for ${branch}: #${prs[0].number} (${prs[0].state})`);
                return true;
              }

              return false;
            }

            async function findDigestFile(branch) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `main...${branch}`,
              });

              if (comparison.ahead_by === 0) {
                core.info(`${branch} has no commits ahead of main; skipping.`);
                return null;
              }

              return (comparison.files ?? []).find((file) =>
                file.status !== "removed" &&
                /^content\/\d{4}-\d{2}-\d{2}\/[^/]+\.md$/.test(file.filename)
              )?.filename ?? null;
            }

            async function readFileAtRef(path, ref) {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref,
              });

              if (Array.isArray(data) || data.type !== "file" || !("content" in data)) {
                throw new Error(`${path} at ${ref} is not a file`);
              }

              return Buffer.from(data.content, "base64").toString("utf8");
            }

            async function ensurePr(branch) {
              if (!branch.startsWith("claude/")) {
                core.info(`${branch} is not a Routine branch; skipping.`);
                return;
              }

              if (await prAlreadyExists(branch)) return;

              let digestFile;
              try {
                digestFile = await findDigestFile(branch);
              } catch (error) {
                core.warning(`Could not compare ${branch} with main: ${error.message}`);
                return;
              }

              if (!digestFile) {
                core.info(`${branch} has no digest markdown changes; skipping.`);
                return;
              }

              const [, dateDir, fileName] = digestFile.split("/");
              const digestType = digestTypes.get(fileName) ?? "digest";
              const markdown = await readFileAtRef(digestFile, branch);
              const editorNote = extractEditorNote(markdown);
              const body = editorNote || `Automated Routine output from ${branch}.`;

              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                base: "main",
                head: branch,
                title: `${digestType} — ${dateDir}`,
                body,
              });

              core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            }

            const branches = context.eventName === "push"
              ? [context.ref.replace("refs/heads/", "")]
              : await listRoutineBranches();

            core.info(`Checking ${branches.length} Routine branch(es).`);
            for (const branch of branches) {
              await ensurePr(branch);
            }
